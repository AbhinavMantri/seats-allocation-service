security.jwt.secret=prod-secret-change-me

# Internal API access control
internal.api.service-tokens.inventory-service=seats-strong-prod-token
internal.api.service-tokens.booking-service=booking-service-prod-token

# Local PostgreSQL (prod)
spring.datasource.url=jdbc:postgresql://localhost:5432/allocation_db?currentSchema=allocation_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=allocation_db
